pipelines:
  default:
    - step:
        name: Sync GitHub Mirror
        image: alpine/git:latest
        clone:
          enabled: false
        script:
          - git clone --bare git@bitbucket.org:hotset/frappe-attachments-s3.git
          - cd frappe-attachments-s3.git
          - mkdir -p ~/.ssh
          - ssh-keyscan github.com >> ~/.ssh/known_hosts
          - git push --mirror git@github.com:HotsetGmbH/frappe-attachments-s3.git
